<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Senith Vijayantha, Software Engineer</title>
  <desc id="desc">Banner with the name Senith Vijayantha, the role Software Engineer, and a code card listing a developer profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <text x="72" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="url(#accent)">SOFTWARE ENGINEER</text>
  <text x="72" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#e6edf3">Senith Vijayantha</text>
  <text x="72" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">Full-stack web applications, backend architecture,</text>
  <text x="72" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">and the fundamentals underneath them.</text>
  <text x="72" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#6e7681">Sri Lanka</text>

  <rect x="735" y="60" width="393" height="200" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="735" y="60" width="393" height="36" rx="12" fill="#161b22"/>
  <rect x="735" y="84" width="393" height="12" fill="#161b22"/>
  <circle cx="757" cy="78" r="6" fill="#ff5f56"/>
  <circle cx="777" cy="78" r="6" fill="#ffbd2e"/>
  <circle cx="797" cy="78" r="6" fill="#27c93f"/>
  <text x="762" y="150" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#ff7b72">const <tspan fill="#79c0ff">profile</tspan> <tspan fill="#e6edf3">= {</tspan></text>
  <text x="762" y="176" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#e6edf3">  role: <tspan fill="#a5d6ff">"Software Engineer"</tspan>,</text>
  <text x="762" y="202" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#e6edf3">  stack: [<tspan fill="#a5d6ff">"React"</tspan>, <tspan fill="#a5d6ff">"Next.js"</tspan>,</text>
  <text x="762" y="226" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#a5d6ff">          "TypeScript", "Node.js"],</text>
  <text x="762" y="250" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#e6edf3">};</text>
</svg>
